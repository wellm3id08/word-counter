<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Word Counter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="counter">
    <h1>Word Counter</h1>
    <textarea id="text" rows="10" placeholder="Paste or type your text here"></textarea>
    <p class="stats">
      <span><strong id="words">0</strong> words</span>
      <span><strong id="characters">0</strong> characters</span>
      <span><strong id="reading-time">0 min</strong> to read</span>
    </p>
    <button id="clear" type="button">Clear</button>
  </main>
  <script src="script.js"></script>
</body>
</html>
